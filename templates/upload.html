<!DOCTYPE html>
<html>

<head>
    <title>AI Resume Analyzer</title>
</head>

<body>

<h1>Upload Resume</h1>

<form method="POST" enctype="multipart/form-data">

<br><br>

<button type="submit">
Upload
</button>

</form>

</body>

</html>
